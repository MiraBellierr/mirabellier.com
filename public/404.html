<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>Page not found | Mirabellier</title>
    <meta
      name="description"
      content="That page could not be found. It may have moved, been removed, or never existed."
    />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        align-items: center;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 255, 255, 0.72),
            rgba(255, 255, 255, 0.92)
          ),
          linear-gradient(
            180deg,
            rgba(239, 246, 255, 0.94),
            rgba(219, 234, 254, 0.88)
          );
        color: #1d4ed8;
        display: flex;
        font-family:
          "Fredoka", "Quicksand", "Avenir Next Rounded", "Trebuchet MS",
          "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 1rem;
      }
      main {
        background: rgba(255, 255, 255, 0.94);
        border-radius: 1rem;
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.12);
        max-width: 34rem;
        padding: 1.75rem;
        width: 100%;
      }
      .eyebrow {
        color: #93c5fd;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        margin: 0 0 0.5rem;
        text-transform: uppercase;
      }
      h1 {
        font-size: clamp(1.5rem, 5vw, 2rem);
        line-height: 1.15;
        margin: 0;
      }
      p {
        font-size: 1rem;
        line-height: 1.7;
        margin: 0.85rem 0 0;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.25rem;
      }
      a {
        background: rgba(219, 234, 254, 0.9);
        border: 1px solid rgba(147, 197, 253, 0.95);
        border-radius: 999px;
        color: #1d4ed8;
        font-size: 0.9rem;
        font-weight: 700;
        padding: 0.35rem 0.8rem;
        text-decoration: none;
      }
      a:hover {
        background: #ffffff;
        text-decoration: underline;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background:
            radial-gradient(
              circle at top,
              rgba(67, 56, 202, 0.28),
              rgba(17, 24, 39, 0.92)
            ),
            linear-gradient(
              180deg,
              rgba(30, 27, 75, 0.94),
              rgba(15, 23, 42, 0.96)
            );
          color: #f5e8ff;
        }
        main {
          background: rgba(30, 27, 75, 0.72);
          box-shadow: 0 10px 28px rgba(15, 23, 42, 0.24);
        }
        .eyebrow {
          color: #c4b5fd;
        }
        a {
          background: rgba(15, 23, 42, 0.6);
          border-color: rgba(196, 181, 253, 0.24);
          color: #e9d5ff;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">error 404</p>
      <h1>(｡•́︿•̀｡) this page wandered off</h1>
      <p>
        That page could not be found. It may have moved, been removed, or never
        existed. Check the address for a typo, or try one of these instead:
      </p>
      <nav>
        <a href="/">Home</a>
        <a href="/blog">Blog</a>
        <a href="/question-of-the-day">Question of the Day</a>
        <a href="/shrine">Shrines</a>
        <a href="/about">About</a>
      </nav>
    </main>
  </body>
</html>
