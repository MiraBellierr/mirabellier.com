# Keeps dependency advisories from silently re-accumulating: Dependabot opens
# grouped PRs for the frontend and the GitHub Actions used here. The backend
# lives in its own repo (MiraBellierr/mirabellier-backend) with its own
# dependabot.yml.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
