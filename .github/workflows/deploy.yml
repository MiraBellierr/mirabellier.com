name: CI and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FRONTEND_DEPLOY_PATH: /var/www/mirabellier.com/current
  VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADnfSZ1AsWqZYErS

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error

  deploy-frontend:
    needs: build-frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Prepare frontend directory on VPS
        # Pinned to a commit SHA (v1.2.5) — this step receives VPS_SSH_KEY.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -eu
            mkdir -p "${{ env.FRONTEND_DEPLOY_PATH }}"
            find "${{ env.FRONTEND_DEPLOY_PATH }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Copy frontend dist to VPS
        # Pinned to a commit SHA (v1.0.0) — this step receives VPS_SSH_KEY.
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          # dist/* misses dotfiles; list .well-known explicitly so security.txt ships.
          source: "dist/*,dist/.well-known/**"
          target: "${{ env.FRONTEND_DEPLOY_PATH }}"
          strip_components: 1
