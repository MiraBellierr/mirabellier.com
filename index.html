<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirabellier ⭐ — Cute thoughts & cozy corners</title>

    <link
      rel="preload"
      as="font"
      href="/fonts/fredoka-latin-variable.woff2"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      href="/fonts/quicksand-latin-variable.woff2"
      type="font/woff2"
      crossorigin
    />

    <style>
      @font-face {
        font-family: "Fredoka";
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url("/fonts/fredoka-latin-variable.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Quicksand";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/quicksand-latin-variable.woff2") format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Inline critical CSS to prevent FOUC */
      :root {
        --font-body:
          "Fredoka", "Quicksand", "Avenir Next Rounded", "Trebuchet MS", "Segoe UI",
          sans-serif;
        --font-display:
          "Fredoka", "Quicksand", "Avenir Next Rounded", "Trebuchet MS",
          "Segoe UI", sans-serif;
      }
      body {
        font-family: var(--font-body);
        margin: 0;
        padding: 0;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .boot-shell {
        min-height: 100vh;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.92)),
          linear-gradient(180deg, rgba(239, 246, 255, 0.94), rgba(219, 234, 254, 0.88));
        color: #1d4ed8;
      }
      .boot-shell__header {
        border-bottom: 2px solid rgba(147, 197, 253, 0.9);
        background: rgba(239, 246, 255, 0.92);
        box-shadow: 0 1px 3px rgba(37, 99, 235, 0.08);
        font-size: clamp(2rem, 5vw, 2.6rem);
        font-weight: 700;
        padding: 1rem;
        text-align: center;
      }
      .boot-shell__body {
        margin: 0 auto;
        width: min(100%, 80rem);
        padding: 1rem;
      }
      .boot-shell__layout {
        display: grid;
        gap: 1rem;
      }
      .boot-shell__nav {
        border: 1px solid rgba(147, 197, 253, 0.95);
        border-radius: 1rem;
        background: rgba(219, 234, 254, 0.9);
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.1);
        padding: 0.85rem 1rem;
      }
      .boot-shell__nav-label {
        color: #60a5fa;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .boot-shell__nav-value {
        display: inline-block;
        margin-top: 0.35rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        color: #1d4ed8;
        font-size: 0.95rem;
        font-weight: 700;
        padding: 0.35rem 0.8rem;
      }
      .boot-shell__card {
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.08);
        padding: 1.25rem;
      }
      .boot-shell__eyebrow {
        color: #93c5fd;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        margin: 0 0 0.5rem;
        text-transform: uppercase;
      }
      .boot-shell__title {
        color: #1d4ed8;
        font-size: clamp(1.75rem, 4vw, 2.3rem);
        font-weight: 700;
        line-height: 1.1;
        margin: 0;
      }
      .boot-shell__copy {
        color: #2563eb;
        font-size: 1rem;
        line-height: 1.7;
        margin: 0.85rem 0 0;
      }
      .boot-shell__poster {
        display: block;
        width: min(100%, 18rem);
        height: auto;
        margin: 0 auto;
        border: 1px solid #1d4ed8;
        border-radius: 1rem;
        box-shadow: 0 10px 24px rgba(37, 99, 235, 0.18);
      }
      /* Reserve space for content */
      img {
        max-width: 100%;
        height: auto;
      }
      /* Prevent CLS by reserving space for cards */
      .card-border {
        border-width: 10px;
        border-radius: 0.75rem;
        position: relative;
      }
      /* Keep the theme background discoverable before the app hydrates. */
      div[class*="min-h-screen"][class*="bg-cover"][class*="bg-no-repeat"] {
        background-image: url("/light.webp");
        background-size: cover;
        background-position: center;
        background-attachment: scroll;
      }
      html.dark div[class*="min-h-screen"][class*="bg-cover"][class*="bg-no-repeat"] {
        background-image: url("/dark.webp");
      }
      html.dark .boot-shell {
        background:
          radial-gradient(circle at top, rgba(67, 56, 202, 0.28), rgba(17, 24, 39, 0.92)),
          linear-gradient(180deg, rgba(30, 27, 75, 0.94), rgba(15, 23, 42, 0.96));
        color: #e9d5ff;
      }
      html.dark .boot-shell__header,
      html.dark .boot-shell__nav,
      html.dark .boot-shell__card {
        border-color: rgba(196, 181, 253, 0.24);
        background: rgba(30, 27, 75, 0.72);
        box-shadow: 0 10px 28px rgba(15, 23, 42, 0.24);
      }
      html.dark .boot-shell__nav-label,
      html.dark .boot-shell__eyebrow {
        color: #c4b5fd;
      }
      html.dark .boot-shell__nav-value,
      html.dark .boot-shell__title,
      html.dark .boot-shell__copy {
        color: #f5e8ff;
      }
      @media (min-width: 1024px) {
        .boot-shell__layout {
          grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr) minmax(
              12rem,
              18rem
            );
          align-items: start;
        }
      }
    </style>

    <script>
      (function () {
        try {
          var storedTheme = window.localStorage.getItem("mirabellier-theme");

          if (storedTheme === "dark") {
            document.documentElement.classList.add("dark");
          } else if (storedTheme === "light") {
            document.documentElement.classList.remove("dark");
          } else if (
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch {
          // Ignore storage access failures and fall back to the default theme.
        }
      })();
    </script>

    <link rel="icon" href="/favicon.jpg" />
    <link rel="canonical" href="https://mirabellier.com/" />
    <meta
      name="description"
      content="Mirabellier — a tiny, cozy blog where I share cute thoughts, fuzzy photos, and little projects. Come say hi and find something to smile about!"
    />
    <meta
      name="keywords"
      content="mirabellier, blog, cute, kittens, art, personal"
    />
    <meta name="author" content="Mirabellier" />
    <meta
      name="robots"
      content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
    />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Mirabellier ⭐ — Cute thoughts & cozy corners"
    />
    <meta
      property="og:description"
      content="A tiny, cozy blog sharing small joys, photos, and short posts."
    />
    <meta property="og:site_name" content="Mirabellier" />
    <meta property="og:url" content="https://mirabellier.com/" />
    <meta
      property="og:image"
      content="https://mirabellier.com/background.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mirabellier" />
    <meta name="twitter:creator" content="@mirabellier" />
    <meta
      name="twitter:title"
      content="Mirabellier ⭐ — Cute thoughts & cozy corners"
    />
    <meta
      name="twitter:description"
      content="A tiny, cozy blog sharing small joys, photos, and short posts."
    />
    <meta
      name="twitter:image"
      content="https://mirabellier.com/background.jpg"
    />
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <header class="boot-shell__header">Welcome to my website</header>
        <div class="boot-shell__body">
          <div class="boot-shell__layout">
            <aside class="boot-shell__nav">
              <div class="boot-shell__nav-label">site navigation</div>
              <div class="boot-shell__nav-value">home</div>
            </aside>
            <main class="boot-shell__card">
              <p class="boot-shell__eyebrow">cute thoughts &amp; cozy corners</p>
              <h1 class="boot-shell__title">Mirabellier</h1>
              <p class="boot-shell__copy">
                A tiny personal corner full of blog posts, projects, shrine pages,
                anime lists, and soft little internet things.
              </p>
            </main>
            <div>
              <img
                class="boot-shell__poster"
                src="/kanna-kobayashi-poster.webp"
                width="300"
                height="404"
                alt="Kanna Kobayashi poster"
                decoding="async"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Mirabellier",
        "url": "https://mirabellier.com",
        "description": "A tiny, cozy blog sharing small joys, photos, and short posts.",
        "publisher": { "@type": "Person", "name": "Mirabellier" }
      }
    </script>
  </body>
</html>
