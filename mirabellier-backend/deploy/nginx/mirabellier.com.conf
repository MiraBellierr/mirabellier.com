# ---------------------------------------------------------------------------
# Soft-404 guard.
#
# `location /` has to fall back to the SPA entry for real client-side routes,
# but nginx cannot tell a real route from a typo's URL — so every unknown path
# used to answer 200 with the generic homepage head (`<link rel=canonical>`
# pointing at `/`). Google indexes those as duplicates of `/` or classifies
# them as soft-404s, and the runtime `noindex` in `src/pages/NotFound.tsx`
# never reaches a crawler that does not run the bundle.
#
# This map flags the route prefixes the SPA actually serves. `@spa_fallback`
# hands those the app and everything else a real 404 (see the 404.html
# `error_page` below). Keep in sync with `<Routes>` in `src/App.tsx`: a route
# missing here hard-404s on direct load, so test after adding routes; a stale
# entry is only a missed soft-404, never an outage. Unknown paths that still
# land inside an allowed prefix (`/arena/typo`) render the SPA's own NotFound
# rather than an HTTP 404 — narrower than before, and the prefixes stay broad
# on purpose so a new sub-route is served instead of broken.
#
# The patterns are case-insensitive (`~*`) because React Router's routes
# default to `caseSensitive: false`: `/About` is a working URL today, so it
# must not start 404ing here.
#
# Routes handled by their own locations above never reach this map: the proxied
# ones (`/blog/<slug>`, `/shrine/<slug>`, `/profile/<user>`, `/pixies/<id>`,
# `/quotes`, `/anime`, `/question-of-the-day`, ...) and the exact static ones
# (`/index.html`, `/sw.js`, `/blog/edit`, `/pixies/upload`, ...).
# ---------------------------------------------------------------------------
map $uri $mirabellier_spa_route {
    default 0;

    # Homepage, plus the client-side `/home` alias.
    ~*^/(?:home)?/?$                                                                   1;

    # Static pages that get a prerendered `<route>/index.html` at build time.
    ~*^/(?:about|now|changelog|uses|stats|links|projects|fanart|twitch|blog|privacy|terms|login|settings)/?$ 1;

    # Guestbook, the Discord auth callback, and the retired staging entry.
    ~*^/guestbook(?:/sign)?/?$                                                         1;
    ~*^/auth/callback/?$                                                               1;
    ~*^/staging/tcg/?$                                                                 1;

    # Client-side redirect aliases for the Pixies section.
    ~*^/(?:poloroid|loops|reels)(?:/upload)?/?$                                        1;

    # Arena hub and every arena sub-route (the retired `/ar` prefix included).
    ~*^/(?:arena|ar)(?:/.*)?$                                                          1;

    # Admin console (client-rendered; the API behind it is owner-gated).
    ~*^/admin(?:/.*)?$                                                                 1;

    # Profile pages (bare `/profile` or one username segment).
    ~*^/profile(?:/[^/]+)?/?$                                                          1;

    # Pixies feed and share links.
    ~*^/pixies(?:/[^/]+)?/?$                                                           1;

    # Question archive index + per-day pages. The whole subtree is allowed on
    # purpose: the per-day heads are built from a build-time API fetch, and a
    # flaky fetch must degrade to the SPA fallback, not to an empty archive.
    ~*^/question-of-the-day/archive(?:/.*)?$                                           1;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # `www` is deliberately absent: it has its own redirect block below, and
    # listing it here would make this block win the server_name match again.
    server_name mirabellier.com;

    root /var/www/mirabellier.com/current;
    index index.html;

    client_max_body_size 100M;

    # Shared proxy headers for all proxied locations in this server
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Security headers ---------------------------------------------------
    # The audit (improve.md item 6) found HSTS, X-Content-Type-Options, and
    # Referrer-Policy absent from every nginx-served response. The backend
    # already sends all three via helmet (see app.js), but the homepage,
    # prerendered heads, SPA fallback, static assets, and the 404 document are
    # served by nginx itself and carried none of them.
    #
    # Values mirror helmet exactly. HSTS is `max-age=31536000; includeSubDomains`,
    # so a repeat visitor's http:// request is rewritten to https:// before it
    # leaves the browser (no redirect hop), and every current subdomain is
    # covered: www (Let's Encrypt cert with a www SAN), api, and penbot (both
    # behind Cloudflare's *.mirabellier.com certificate). `preload` is
    # deliberately absent; it needs a hstspreload.org submission and is hard to
    # undo. Cert renewal is the one thing to keep healthy: every HSTS user
    # loses click-through for the max-age window if the cert cannot be served.
    #
    # Referrer-Policy is `no-referrer`, matching helmet and the rel="noreferrer"
    # links already used across the frontend. The Discord OAuth handoff does not
    # depend on the Referer header: the frontend passes `redirect_origin`
    # explicitly and the server falls back to FRONTEND_URL.
    #
    # `always` matters: without it nginx omits add_header on non-2xx/3xx
    # responses, so the 404 document and nginx error pages would be missing
    # HSTS exactly when the browser is deciding whether to upgrade.
    #
    # nginx's add_header does NOT merge with a location's own add_header: a
    # location that declares any add_header silently drops every inherited one.
    # Each location below that sets Cache-Control therefore repeats these three.
    #
    # proxy_hide_header strips the upstream copy on proxied routes so the field
    # is sent exactly once (RFC 6797 allows only one Strict-Transport-Security
    # header field; duplicates would also be sloppy for the other two).
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- New: never rewrite JS/CSS chunks to HTML ---
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeated: a location with its own add_header drops the inherited set.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Keep HTML + SW fresh
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # --- NEW: static art, fonts, and cursor GIFs ---
    # Stable filenames (page backgrounds also carry ?v= in index.html and
    # src/index.css, bumped when the file changes). A week + background
    # revalidation instead of the inherited 4h. try_files =404 keeps missing
    # files from falling through to the SPA HTML.
    location ^~ /fonts/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /cursors/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Root-level files only (no slash), so it cannot shadow the proxied
    # /blog/<slug> and /profile/<user> regexes below.
    location ~* ^/[^/]+\.(?:webp|png|jpe?g|gif|ico|svg)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Crawler files regenerate when content changes — keep them short.
    location ~* ^/(feed\.xml|feed\.json|sitemap\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Legacy API compatibility on main domain (internal rewrite, no external redirect)
    location = /api {
        rewrite ^ /v1/ break;
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /api/ {
        rewrite ^/api/?(.*)$ /v1/$1 break;
        proxy_pass http://127.0.0.1:3000;
    }

    # Optional direct /v1 support on main domain
    location = /v1 {
        rewrite ^ /v1/ break;
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Keep SPA editor route on frontend (otherwise /blog/<slug> regex would catch it)
    location = /blog/edit {
        try_files $uri $uri/index.html /index.html;
    }

    # Same idea for the upload page: the `^/pixies/[^/]+/?$` proxy below would
    # otherwise catch it and serve the generic SPA entry, discarding the
    # build-time `noindex,follow` head the prerender wrote for this route.
    # An exact match wins over the regex locations.
    location = /pixies/upload {
        try_files $uri $uri/index.html /index.html;
    }

    location = /blog/index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # --- SSR HTML routes from backend ---
    location ~ ^/(anime|quotes|question-of-the-day|shrine)/?$ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ^~ /question-of-the-day/answers/ {
    proxy_pass         http://127.0.0.1:3000;   # same upstream as the other QOTD blocks
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;   # keeps og:image on https://
    }

    location ~ ^/blog/[^/]+/?$ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/profile/[^/]+/?$ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/question-of-the-day/answers/[^/]+/?$ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/shrine/[^/]+/?$ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/pixies/?$ {
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/pixies/[^/]+/?$ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Serve uploaded pixie videos (used by og:video embeds)
    location ^~ /videos/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # --- SSR preview image endpoints ---
    location = /anime/currently-watching/embed-image.png {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /quotes/embed-image.png {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /question-of-the-day/embed-image.png {
        proxy_pass http://127.0.0.1:3000;
    }

    # Frontend SPA fallback.
    #
    # `$uri/index.html` must come BEFORE `$uri/`: the build prerenders a real
    # `index.html` inside a directory per route (about/, blog/, arena/, every
    # archived question day, every blog post, ...), and nginx's `$uri/`
    # candidate matches the bare directory, which makes it answer 301 to
    # `/about/`. That 301 contradicted the route's slash-less canonical and
    # og:url, so crawlers were told the canonical target was a redirect.
    # Resolving the directory's index file directly serves the prerendered
    # head at the canonical URL with no redirect. `$uri/` is dropped, not
    # merely reordered: a directory without an index.html would otherwise
    # 301 into a 403 (directory listing disabled) instead of the SPA.
    #
    # The last candidate is the route guard, not `/index.html` directly: an
    # unknown path must not answer 200 with the homepage head.
    location / {
        try_files $uri $uri/index.html @spa_fallback;
    }

    # Real SPA routes get the app entry; anything else is a genuine 404. The
    # `error_page` below is what makes that 404 a readable document instead of
    # nginx's bare error page, and `=404` matters: without it nginx would look
    # for a `404.html` file in the root and fall back to its own page when one
    # is missing.
    location @spa_fallback {
        if ($mirabellier_spa_route = 0) {
            return 404;
        }
        rewrite ^ /index.html last;
    }

    error_page 404 =404 /404.html;

    location = /404.html {
        internal;
    }

    ssl_certificate /etc/letsencrypt/live/mirabellier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirabellier.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# `www.mirabellier.com` is the same site on a second hostname, and it used to
# answer full 200s (its own robots.txt, sitemap.xml, and every route) because
# it shared the `server_name` above. Each one is a crawlable duplicate of the
# apex: the canonical pointed at mirabellier.com, so it would not outrank it,
# but it still spends crawl budget on the smallest site here.
#
# Every method and path 301s to the apex, preserving the path and query so
# deep links keep working. `$request_uri` is used rather than `$uri` because
# it is the raw original (not normalized or decoded), which keeps the redirect
# target byte-identical to what the client asked for.
#
# This block must stay in front of the main server block only in the sense that
# server_name matching does the work: nginx picks the most specific
# `server_name`, so `www` lands here and the apex still lands above. Do not
# re-add `www` to the main block's `server_name`, or it will win again.
#
# A port-80 listener is deliberately NOT added here: the certificate is issued
# through certbot, and how its HTTP-01 challenge is served (webroot vs the
# distro's default site) is not visible from this repo. Adding a catch-all
# redirect on port 80 could break renewals. Once renewals are confirmed to use
# the nginx plugin (or a webroot under this host), a matching port-80 block can
# be added to redirect http://www to https://mirabellier.com too.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mirabellier.com;

    # Same certificate as the apex; it already carries a www SAN (verified
    # against the live cert), so the redirect completes over HTTPS without a
    # second certificate or a TLS warning.
    ssl_certificate /etc/letsencrypt/live/mirabellier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirabellier.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A visitor who lands on www first gets the policy here, before the apex
    # ever loads, so the http:// hop is removed on their next visit too. The
    # includeSubDomains directive covers only *.www.mirabellier.com (HSTS
    # cannot span sibling hosts), which is harmless. The apex's own header is
    # what protects everything else.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    return 301 https://mirabellier.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mirabellier.com;

    # Match the app's 250MB multer video limit (nginx default is 1MB)
    client_max_body_size 300M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The backend sends these on every response via helmet; hide that copy so
    # the nginx-generated 308s get only one, matching the apex block.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Canonical API prefix
    location = /v1 {
        return 308 /v1/;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3000;
    }

    # Backward compatibility for old /api/* callers
    location = /api {
        return 308 /v1/;
    }

    location ^~ /api/ {
        rewrite ^/api/?(.*)$ /v1/$1 break;
        proxy_pass http://127.0.0.1:3000;
    }

    # Keep non-versioned backend routes working (e.g. /auth/discord/callback)
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    ssl_certificate /etc/letsencrypt/live/mirabellier.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirabellier.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
